<script>(function(){var t=null;try{t=localStorage.getItem('leave_theme_v3')}catch(e){}if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})();</script>

<style>
:root{--bg:#f2f4f6;--surface:#fff;--line:#dde3e8;--text:#15212b;--muted:#5d6b78;--accent:#0f766e;--accent-ink:#fff;--soft:#e6f3f1;--ok:#15803d;--ok-bg:#e3f4e8;--warn:#9a5b00;--warn-bg:#fdf0d5;--bad:#b42318;--bad-bg:#fde8e6;--hover:#f6f8fa;--r:10px}
html[data-theme=dark]{--bg:#0e1418;--surface:#161e24;--line:#26323b;--text:#e6edf2;--muted:#92a1ad;--accent:#38b2a4;--accent-ink:#04201d;--soft:#12302d;--ok:#5fd08a;--ok-bg:#12301f;--warn:#f0b44c;--warn-bg:#3a2c0e;--bad:#ff8a80;--bad-bg:#3b1b19;--hover:#1b252c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',Tahoma,Arial,sans-serif;font-size:15px;line-height:1.6}
.hidden{display:none!important}
.ck{width:38px;min-width:38px;text-align:center!important;padding-inline:6px!important}.rc{width:18px;height:18px;cursor:pointer;accent-color:var(--accent)}
.bulkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--bad-bg);color:var(--bad);border-bottom:1px solid var(--line);font-weight:600;position:sticky;top:0;z-index:5}
.bulkbar .btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}

body:not(.is-admin) .adm{display:none!important}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);outline:none}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input[readonly]{background:var(--hover);color:var(--muted)}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border:1px solid var(--accent);border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--line)}
.btn.sm{padding:4px 10px;font-size:13px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 40px}
.bar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar .in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-inline-end:auto}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--accent);font-weight:600}
.bar select{width:auto;padding:5px 9px}
.nav{display:flex;gap:2px;overflow-x:auto;max-width:1100px;margin:0 auto;padding:0 12px}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
.nav .cnt{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;margin-inline-start:5px}
h2{font-size:19px;margin:22px 0 12px}
h3{font-size:16px;margin:0 0 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.panel.flush{padding:0;overflow:hidden}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi span{color:var(--muted);font-size:13px}.kpi b{display:block;font-size:28px;line-height:1.3}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input,.tools select{width:auto;flex:1 1 150px;min-width:0}
.scroll{overflow-x:auto}
.panel.flush.scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
@media(min-width:701px){
  .wrap,.bar .in,.nav{max-width:1400px}
  .panel.flush.scroll th,.panel.flush.scroll td{padding:9px 10px}
  .panel.flush.scroll td:last-child .act{flex-wrap:nowrap}
}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:600;background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
td.n{font-variant-numeric:tabular-nums}
.act{display:flex;gap:6px}
.badge{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:600}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}
.neg{color:var(--bad);font-weight:700}
.muted{color:var(--muted)}.empty{padding:26px;text-align:center;color:var(--muted)}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:90px}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.track i.low{background:var(--bad)}
.form{display:grid;gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice{padding:10px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--warn);margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.chart{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:8px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--muted);gap:4px}
.chart i{display:block;width:100%;max-width:36px;background:var(--accent);border-radius:5px 5px 0 0;min-height:2px}
.chart b{color:var(--text);font-weight:600;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0;padding-bottom:0}.row:first-child{padding-top:0}
.modal{position:fixed;inset:0;background:rgba(5,10,14,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:20px}
.mbox h3{margin-bottom:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;padding:10px 18px;border-radius:var(--r);background:var(--text);color:var(--bg);font-weight:600;max-width:90vw}
.toast.bad{background:var(--bad);color:#fff}
/* auth */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.abox{width:100%;max-width:400px}
.abox h1{font-size:22px;margin:0 0 4px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--hover);border:1px solid var(--line);border-radius:var(--r);padding:3px;margin:16px 0}
.seg button{border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.err{color:var(--bad);font-size:14px;min-height:22px;margin-top:10px}
/* employee */
.hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.hero .big{font-size:54px;font-weight:700;line-height:1;color:var(--accent)}
.hero .big.neg{color:var(--bad)}
.hero .info{flex:1;min-width:200px}
.nav a.lnk{padding:10px 14px;color:var(--muted);font-weight:600;white-space:nowrap;text-decoration:none;border-bottom:3px solid transparent}
.nav a.lnk:hover{color:var(--accent)}
.grid2{display:grid;grid-template-columns:3fr 2fr;gap:14px;margin-bottom:14px}
.alerts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.acard{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;border-inline-start:4px solid var(--ok)}
.acard.warn{border-inline-start-color:var(--warn)}.acard.bad{border-inline-start-color:var(--bad)}
.acard span{color:var(--muted);font-size:13px}.acard b{display:block;font-size:24px;line-height:1.3}.acard small{color:var(--muted)}
.hb{margin-bottom:12px}.hb div{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.kpi small{color:var(--muted);font-size:12px}
.welcome{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:22px 0 14px}.welcome h2{margin:0}
@media(max-width:700px){.grid2{grid-template-columns:1fr}.alerts{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.hero .big{font-size:44px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.chk{border:1px solid var(--line);border-radius:var(--r);max-height:190px;overflow:auto;padding:6px 10px;background:var(--surface)}
.chk label{display:flex;align-items:center;gap:8px;margin:0;padding:4px 0;color:var(--text);font-size:14px;cursor:pointer}
.chk input{width:auto}
.nav a.back{margin-inline-end:auto;color:var(--accent)}
.hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

#printArea{display:none}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:24px 0 10px}.sec h3{margin:0;font-size:17px}
.fb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.fb input{flex:1 1 180px;min-width:0}
.fp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
.fsum{margin-bottom:8px;font-size:13px}
.rp{background:#fff;color:#000;font-family:'Cairo',Tahoma,Arial,sans-serif;direction:rtl;padding:0}
.rp h1{font-size:22px;margin:0 0 4px;color:#0f766e}.rp h2{font-size:16px;margin:0 0 8px}
.rp .rph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #0f766e;padding-bottom:8px;margin-bottom:10px}
.rp .rpm{font-size:12px;color:#444}
.rp .rpk{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.rp .rpk span{background:#e6f3f1;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:700}
.rp table{width:100%;min-width:0;border-collapse:collapse;font-size:12px}
.rp thead{display:table-header-group}
.rp th,.rp td{border:1px solid #8a99a0;padding:5px 7px;text-align:right;white-space:normal;background:#fff;color:#000;vertical-align:middle}
.rp th{background:#0f766e;color:#fff;border-color:#0f766e;font-weight:700;text-align:center}.rp tr{page-break-inside:avoid}
.rp tbody tr:not([class]):nth-child(even) td{background:#f1f6f6}
.rp td.n{text-align:center;font-variant-numeric:tabular-nums}.rp td.nm{white-space:nowrap;font-weight:600}
.rp tr.rs-ok td{background:#e3f4e8}.rp tr.rs-warn td{background:#fdf0d5}.rp tr.rs-bad td{background:#fde2e0}
.rp .rpf{font-size:10px;color:#666;margin-top:10px;text-align:center}
@media print{
  html,body{background:#fff!important;color:#000}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:0}
  a[href]::after{content:none!important}a{color:inherit;text-decoration:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:700px){
  body{font-size:14px}input,select{font-size:16px}
  .btn{min-height:40px}.btn.sm{min-height:34px}
  .wrap{padding:0 10px 32px}.panel{padding:12px}
  .bar .in{padding:8px 10px;gap:6px}
  .brand{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav{padding:0 4px}.nav button,.nav a.lnk{padding:10px 11px;font-size:14px}
  .panel table{min-width:max-content;font-size:13px}
  .panel th,.panel td{padding:6px 8px;white-space:nowrap}
  .panel .btn.sm{min-height:28px;padding:2px 8px;font-size:12px}
  .fp{grid-template-columns:1fr 1fr}.fp .btn{grid-column:1/-1}
  .acard b{font-size:19px}.kpi b{font-size:24px}
  .fb .btn{flex:1 1 auto}
}

<script>
(function(){
'use strict';
const SUPABASE_URL='https://imvjxjnyclyzxemtitbt.supabase.co';
const SUPABASE_KEY='sb_publishable_JVuF-CEoQTzrfVlUAdLoyg_mSSfX4aT';
const $=window.$=id=>document.getElementById(id);
const A=window.A={};
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const n1=x=>String(Math.round(Number(x||0)*10)/10);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const S={e:[],ppe:[],cust:[],ot:[],trv:[],acc:[],session:null};
let db=null;
const PPE={'سيفتي':{m:12,i:'👞'},'خوذة':{m:12,i:'⛑️'},'فيست':{m:3,i:'🦺'},'جوانتي':{m:1,i:'🧤'}};
const OT_TYPES={'جمعة':18,'سبت':12,'إجازة رسمية':18,'يوم عمل':0,'سهرة 3':3,'سهرة 6':6};
const today=()=>new Date().toISOString().slice(0,10);
const isAdmin=()=>String(((S.session&&S.session.user&&S.session.user.app_metadata)||{}).role||'').toLowerCase()==='admin';
const addMonths=(d,m)=>{const x=new Date(d+'T00:00:00');if(isNaN(x))return'';x.setMonth(x.getMonth()+m);return x.toISOString().slice(0,10)};
const empOf=id=>S.e.find(e=>String(e.id)===String(id))||{};
const stBadge=s=>'<span class="badge b-'+s.c+'">'+s.t+'</span>';
const tbl=(head,rows,empty)=>rows.length?'<table><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>{let i=0;return r.replace(/<td/g,()=>'<td data-label="'+esc(head[i++]||'')+'"')}).join('')+'</tbody></table>':'<div class="empty">'+(empty||'لا توجد بيانات')+'</div>';
function toast(t,ok=true){const el=$('toast');el.textContent=t;el.className='toast'+(ok?'':' bad');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),3200)}
function friendly(err){const x=String(typeof err==='string'?err:(err&&(err.message||err.details||err.hint))||'خطأ غير معروف'),l=x.toLowerCase();
  if(l.includes('row-level security'))return'الصلاحيات تمنع هذه العملية.';if(l.includes('does not exist')||l.includes('schema cache'))return'الجدول غير موجود في Supabase: '+x;
  if(l.includes('failed to fetch')||l.includes('network'))return'مشكلة اتصال بالإنترنت أو Supabase.';return x}
async function audit(action,module,details,recordId,employeeId){try{await db.rpc('write_audit_log',{p_action:action,p_module:module,p_details:details||'',p_record_id:recordId?String(recordId):null,p_employee_id:employeeId?String(employeeId):null,p_actor_code:null})}catch(e){}}
function openModal(t,h){$('mbox').innerHTML='<h3>'+esc(t)+'</h3>'+h;$('modal').classList.remove('hidden')}
A.close=()=>{$('modal').classList.add('hidden');$('mbox').style.maxWidth=''};
A.out=async()=>{await audit('خروج','الدخول','تسجيل خروج الإدارة');try{await db.auth.signOut()}catch(e){}location.href='index.html'};
function busy(b,on){if(!b)return;if(on){b.dataset.t=b.textContent;b.textContent='جارٍ…';b.disabled=true}else{b.textContent=b.dataset.t||b.textContent;b.disabled=false}}
A.theme=()=>{const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',t);store.set('leave_theme_v3',t)};
const empSel=(id,v)=>'<select id="'+id+'">'+S.e.map(e=>'<option value="'+esc(e.id)+'"'+(String(e.id)===String(v)?' selected':'')+'>'+esc(e.code)+' — '+esc(e.name)+'</option>').join('')+'</select>';
const chkList=(id,list,sel)=>'<div class="chk" id="'+id+'">'+(list.length?list.map(e=>'<label><input type="checkbox" value="'+esc(e.id)+'"'+(sel&&sel.has(String(e.id))?' checked':'')+'> '+esc(e.code)+' — '+esc(e.name)+'</label>').join(''):'<div class="muted">لا يوجد موظفون</div>')+'</div>';
const checked=id=>Array.from(document.querySelectorAll('#'+id+' input:checked')).map(i=>i.value);
const dueState=n=>{if(!n)return{c:'ok',t:'—'};const d=Math.round((new Date(n+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);return d<0?{c:'bad',t:'متأخر '+(-d)+' يوم'}:d<=14?{c:'warn',t:'قريب ('+d+' يوم)'}:{c:'ok',t:'سليم'}};

/* ===== تحميل ===== */
A.load=async()=>{
  const q=(t,o)=>{let r=db.from(t).select('*');if(o)r=r.order(o,{ascending:false});return Promise.resolve(r).catch(e=>({error:e}))};
  const [e,p,c,o,t,a]=await Promise.all([Promise.resolve(db.from('employees').select('*').eq('active',true).order('code')).catch(x=>({error:x})),q('ppe_receipts','receipt_date'),q('custody_items','receipt_date'),q('overtime_entries','overtime_date'),q('travel_routes','route_date'),q('travel_access')]);
  const errs=[];const g=(x,n)=>{if(!x||x.error){errs.push(n+': '+friendly(x&&x.error));return[]}return x.data||[]};
  S.e=g(e,'الموظفين');S.ppe=g(p,'HSE');S.cust=g(c,'العهدة');S.ot=g(o,'الأوفر تايم');S.trv=g(t,'المواصلات');S.acc=g(a,'صلاحيات المواصلات');
  if(errs.length)toast(errs.join(' | '),false);
  A.rOt();A.gall();
};

/* ===== استيراد الأوفر تايم من Excel (مع فحص التكرار) ===== */
const OT_HEAD=['الكود','الاسم','التاريخ','نوع اليوم','من','إلى','الساعات','السبب'];
const otPad=n=>String(n).padStart(2,'0');
const otValid=(y,m,d)=>{const x=new Date(y,m-1,d);return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d?y+'-'+otPad(m)+'-'+otPad(d):null};
function otDate(v){
  if(v===''||v==null)return'';
  if(typeof v==='number'&&isFinite(v)){const p=XLSX.SSF.parse_date_code(v);return p?otValid(p.y,p.m,p.d):null}
  const t=String(v).trim().replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632);
  let m=t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(m)return otValid(+m[1],+m[2],+m[3]);
  m=t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;return otValid(y,+m[2],+m[1])}
  return null;
}
function otTime(v){
  if(v===''||v==null)return'';
  if(typeof v==='number'&&isFinite(v)){const mins=Math.round((v%1)*1440);return otPad(Math.floor(mins/60)%24)+':'+otPad(mins%60)}
  const t=String(v).trim().replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632),m=t.match(/^(\d{1,2}):(\d{2})/);
  return m&&+m[1]<24&&+m[2]<60?otPad(+m[1])+':'+m[2]:null;
}
const otNormType=v=>{const t=String(v||'').trim().replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632);if(!t)return'';
  if(t.includes('جمع'))return'جمعة';if(t.includes('سبت'))return'سبت';if(t.includes('رسمي'))return'إجازة رسمية';
  if(t.includes('سهر')||t.includes('سهرة')){if(t.includes('3'))return'سهرة 3';if(t.includes('6'))return'سهرة 6';return''}
  if(t.includes('عمل'))return'يوم عمل';return''};

  openModal('استيراد أوفر تايم من Excel','<div class="form"><div class="muted">الأعمدة: الكود، الاسم، التاريخ، نوع اليوم (جمعة / سبت / إجازة رسمية / يوم عمل / سهرة 3 / سهرة 6)، من، إلى، الساعات، السبب. الساعات ثابتة للأنواع المعروفة (جمعة 18، سبت 12، رسمية 18، سهرة 3، سهرة 6)، وفي "يوم عمل" تُكتب أو تُحسب من الوقت. السجل المكرر (نفس الموظف ونفس اليوم) يتم تخطيه. يُسجَّل كل شيء كمعتمد.</div>'+
    '<div class="two"><button class="btn ghost" onclick="A.otTpl(false)">نموذج فارغ</button><button class="btn ghost" onclick="A.otTpl(true)">نموذج بأسماء الموظفين</button></div>'+
    '<input id="otf" type="file" accept=".xlsx,.xls,.csv" onchange="A.otImpRead(this)"><div id="otPrev"></div></div>');
  $('mbox').style.maxWidth='760px'};
A.otTpl=full=>{
  if(!window.XLSX)return toast('مكتبة Excel لم تُحمّل.',false);
  const rows=full&&S.e.length?S.e.map(e=>[String(e.code),e.name,'','','','','','']):[
    ['101','اسم الموظف','2026-12-04','جمعة','','','','عمل إضافي'],
    ['102','اسم موظف آخر','2026-12-05','سبت','','','',''],
    ['103','اسم موظف آخر','2026-12-08','يوم عمل','16:00','19:30','','تشغيل'],

A.otImpRead=async inp=>{

    const byCode=new Map(S.e.map(e=>[String(e.code).trim(),e])),rows=[];
    raw.forEach((o,i)=>{
      const g=ks=>{for(const k of Object.keys(o))if(ks.includes(k.trim().toLowerCase()))return o[k];return''};
      const code=String(g(['الكود','كود','code'])).trim(),name=String(g(['الاسم','اسم','name'])).trim(),dRaw=g(['التاريخ','تاريخ','date']),tRaw=g(['نوع اليوم','النوع','نوع','type']),sRaw=g(['من','من وقت','start']),eRaw=g(['إلى','الى','إلى وقت','الى وقت','end']),hRaw=g(['الساعات','ساعات','hours']),reason=String(g(['السبب','سبب','ملاحظات','reason'])).trim();
      if(!code&&!name&&dRaw===''&&tRaw==='')return;

      else if(!d)r.err='التاريخ غير صحيح أو فاضي';

        r.date=d;r.start=st||null;r.end=en||null;

        r.hours=h;if(!(h>0))r.err='الساعات مطلوبة (اكتبها أو اكتب من/إلى)';
      }

      if(hit){r.dup='مكرر — موجود في السيستم ('+esc(hit.day_type||'')+' '+n1(hit.hours)+' ساعة)';return}

      acc.push(r);

    if(!rows.length){box.innerHTML='<div class="notice" style="display:block">لم أجد صفوفًا. تأكد من عناوين الأعمدة (الكود، التاريخ، نوع اليوم).</div>';return}
    const stx=r=>r.err?'<span class="badge b-bad">خطأ</span> '+esc(r.err):r.dup?'<span class="badge b-warn">مكرر</span> '+r.dup:'<span class="badge b-ok">جديد</span>';
    const sorted=rows.slice().sort((a,b)=>((b.err?2:b.dup?1:0)-(a.err?2:a.dup?1:0))||a.n-b.n);
    box.innerHTML='<div class="notice" style="display:block">'+rows.length+' صف: <b>'+acc.length+'</b> جديد'+(dup?'، <b>'+dup+'</b> مكرر (هيتخطى)':'')+(bad?'، <b>'+bad+'</b> فيه خطأ (هيتخطى)':'')+'.</div>'+
      '<div style="max-height:34vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r)"><table style="min-width:0;font-size:13px"><thead><tr><th>صف</th><th>الكود</th><th>الاسم</th><th>التاريخ</th><th>النوع</th><th>ساعات</th><th>الحالة</th></tr></thead><tbody>'+
      sorted.slice(0,300).map(r=>'<tr><td class="n">'+r.n+'</td><td>'+esc(r.code)+'</td><td>'+esc(r.emp?r.emp.name:r.name)+'</td><td>'+esc(r.date||'')+'</td><td>'+esc(r.type||'—')+'</td><td class="n">'+(r.hours>0?n1(r.hours):'')+'</td><td style="white-space:normal">'+stx(r)+'</td></tr>').join('')+'</tbody></table></div>'+
      (rows.length>300?'<div class="muted" style="margin-top:6px">معروض أول 300 صف فقط.</div>':'')+
      (acc.length?'<button class="btn" id="otGo" style="margin-top:12px" onclick="A.otImpApply()">استيراد '+acc.length+' سجل</button>':'<div class="muted" style="margin-top:10px">لا توجد سجلات جديدة للاستيراد.</div>');
  }catch(e){box.innerHTML='';toast('تعذر قراءة الملف: '+friendly(e),false)}

function gRows(k){
  const o=DS[k],f=FS[k],q=f.q.trim().toLowerCase();
  return(o.rows()||[]).filter(r=>{
    const vals=o.cols.map(c=>gq(c.v(r)));
    if(q&&!vals.some(v=>v.toLowerCase().includes(q)))return false;
    for(let i=0;i<o.cols.length;i++){
      const c=o.cols[i],v=vals[i],a=f.f[i],b=f.t[i];
      if(c.t==='s'&&f.s[i]&&v!==f.s[i])return false;
      if(c.t==='d'){if(a&&(!v||v<a))return false;if(b&&(!v||v>b))return false}
      if(c.t==='n'){if(a!==undefined&&a!==''&&!(+v>=+a))return false;if(b!==undefined&&b!==''&&!(+v<=+b))return false}
    }
    return true;
  });
}
function fcount(k){const f=FS[k];return(f.q.trim()?1:0)+['s','f','t'].reduce((n,w)=>n+Object.values(f[w]).filter(v=>v!==''&&v!=null).length,0)}

const ppeCat=p=>{const t=ppeStat(p).t;return t.startsWith('متأخر')?'متأخر':t.startsWith('قريب')?'قريب':t==='سليم'?'سليم':t==='—'?'—':'تم الصرف بعده'};
const custCat=c=>{const s=custStat(c);return s.c==='bad'?'معايرة منتهية':s.c==='warn'?'قريبة الانتهاء':s.t==='—'?'—':'سليمة'};
const eN=id=>empOf(id).name||'محذوف',eC=id=>empOf(id).code||'—';
const btn3=(a,id,extra)=>(extra||'')+'<button class="btn ghost sm" onclick="A.'+a+'Form(\''+esc(id)+'\')">تعديل</button><button class="btn danger sm" onclick="A.'+a+'Del(\''+esc(id)+'\')">حذف</button>';
A.defGrid('hse',{title:'مهمات الوقاية HSE',adm:true,bulk:{table:'ppe_receipts',id:p=>p.id,noun:'سجل استلام',mod:'مهمات الوقاية HSE'},empty:'لا توجد سجلات',
  rows:()=>S.ppe.slice().sort((a,b)=>String(a.next_due_date||'').localeCompare(String(b.next_due_date||''))),
  cols:[{h:'الكود',v:p=>eC(p.employee_id)},{h:'الموظف',t:'s',v:p=>eN(p.employee_id)},{h:'النوع',t:'s',v:p=>p.item_type,r:p=>((PPE[p.item_type]||{}).i||'')+' '+esc(p.item_type)},
   {h:'الاستلام',t:'d',v:p=>d10(p.receipt_date)},{h:'الاستلام التالي',t:'d',v:p=>d10(p.next_due_date)},{h:'الحالة',t:'s',v:ppeCat,r:p=>stBadge(ppeStat(p))},{h:'ملاحظات',v:p=>p.notes||''}],
  act:p=>btn3('ppe',p.id,'<button class="btn ghost sm" onclick="A.ppeIssue(\''+esc(p.id)+'\')">صرف جديد</button>'),
  sum:r=>r.filter(p=>ppeCat(p)==='متأخر').length+' متأخر · '+r.filter(p=>ppeCat(p)==='قريب').length+' قريب'});
A.defGrid('custody',{title:'العهدة الشخصية',adm:true,bulk:{table:'custody_items',id:c=>c.id,noun:'عهدة',mod:'العهدة الشخصية'},empty:'لا توجد عهد',rows:()=>S.cust,
  cols:[{h:'الكود',v:c=>eC(c.employee_id)},{h:'الموظف',t:'s',v:c=>eN(c.employee_id)},{h:'العهدة',t:'s',v:c=>c.item_name||''},{h:'الاستلام',t:'d',v:c=>d10(c.receipt_date)},
   {h:'المعايرة',v:c=>d10(c.calibration_date)},{h:'الانتهاء',t:'d',v:c=>d10(c.calibration_expiry)},{h:'الحالة',t:'s',v:custCat,r:c=>stBadge(custStat(c))},{h:'ملاحظات',v:c=>c.notes||''}],
  act:c=>btn3('cust',c.id),
  sum:r=>r.filter(c=>custCat(c)==='معايرة منتهية').length+' معايرة منتهية'});
A.defGrid('travel',{title:'بدل المواصلات والسفر',adm:true,bulk:{table:'travel_routes',id:r=>r.id,noun:'خط سير',mod:'بدل المواصلات'},empty:'لا توجد خطوط سير',rows:()=>S.trv,
  cols:[{h:'الكود',v:r=>eC(r.employee_id)},{h:'الموظف',t:'s',v:r=>eN(r.employee_id)},{h:'من',t:'s',v:r=>r.from_place||''},{h:'إلى',t:'s',v:r=>r.to_place||''},{h:'التاريخ',t:'d',v:r=>d10(r.route_date)},{h:'ملاحظات',v:r=>r.notes||''}],
  act:r=>btn3('tv',r.id)});
A.defGrid('ot',{title:'العمل الإضافي',adm:true,bulk:{table:'overtime_entries',id:r=>r.id,noun:'سجل عمل إضافي',mod:'العمل الإضافي'},empty:'لا توجد سجلات',rows:()=>S.ot.filter(r=>otState(r)!=='pending'),
  cols:[{h:'الفترة (19→18)',t:'s',v:r=>periodKey(r.overtime_date)},{h:'التاريخ',t:'d',v:r=>d10(r.overtime_date)},{h:'الكود',v:r=>empOf(r.employee_id).code||r.employee_code||''},
   {h:'الموظف',t:'s',v:r=>empOf(r.employee_id).name||r.employee_name||''},{h:'الساعات',t:'n',v:r=>n1(r.hours)},{h:'نوع اليوم',t:'s',v:r=>r.day_type||''},{h:'السبب',v:r=>r.reason||''},
   {h:'الحالة',t:'s',v:r=>otState(r)==='approved'?'معتمد':'مرفوض',r:r=>stBadge(otState(r)==='approved'?{c:'ok',t:'معتمد'}:{c:'bad',t:'مرفوض'})}],
  act:r=>'<button class="btn danger sm" onclick="A.otDel(\''+esc(r.id)+'\')">حذف</button>',
  sum:r=>n1(r.filter(x=>otState(x)==='approved').reduce((s,x)=>s+(+x.hours||0),0))+' ساعة معتمدة',
  top:rows=>{const by={};rows.filter(r=>otState(r)==='approved').forEach(r=>{const e=empOf(r.employee_id),k=String(r.employee_id);by[k]=by[k]||{n:e.name||r.employee_name||'',c:e.code||r.employee_code||'',h:0,d:new Set()};by[k].h+=+r.hours||0;by[k].d.add(r.overtime_date)});
    return '<h3>ملخص الموظفين</h3><div class="panel flush scroll">'+tbl(['الكود','الموظف','الأيام','إجمالي الساعات'],Object.values(by).sort((a,b)=>b.h-a.h).map(x=>'<tr><td>'+esc(x.c)+'</td><td>'+esc(x.n)+'</td><td class="n">'+x.d.size+'</td><td class="n">'+n1(x.h)+'</td></tr>'))+'</div><h3 style="margin-top:14px">التفاصيل</h3>'}});

/* ===== تنقل وتشغيل ===== */
function go(t){if(!['hse','custody','travel','ot'].includes(t))t='hse';
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('hidden',s.id!=='t-'+t));
  if(location.hash!=='#'+t)history.replaceState(null,'','#'+t)}
$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.t)});
addEventListener('hashchange',()=>go(location.hash.slice(1)));
async function start(){
  if(!window.supabase){$('gateMsg').textContent='تعذر تحميل مكتبة Supabase. تأكد من الإنترنت.';return}
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  try{const {data}=await db.auth.getSession();S.session=data.session}catch(e){}
  if(!S.session){$('gateMsg').textContent='سجّل دخول الإدارة من الصفحة الرئيسية أولًا ثم ارجع هنا.';return}
  document.body.classList.toggle('is-admin',isAdmin());$('roleTag').textContent=isAdmin()?'إدارة':'مشاهدة';
  $('gate').classList.add('hidden');$('app').classList.remove('hidden');
  const now=new Date(),pk=periodKey(now.toISOString().slice(0,10));FS.ot.s[0]=pk;
  go(location.hash.slice(1));await A.load();
}
start();
})();
</script>
